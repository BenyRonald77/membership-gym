{% extends "base.html" %}
{% block title %}Check-in — Membership Gym{% endblock %}
{% block content %}
<h1>Check-in Member</h1>
<div class="card scan">

         autocomplete="off" autofocus>

{% endblock %}
{% block script %}<script src="{{ url_for('static', filename='js/checkin.js') }}"></script>{% endblock %}
