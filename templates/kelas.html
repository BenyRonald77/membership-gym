{% extends "base.html" %}
{% block title %}Kelas — Membership Gym{% endblock %}
{% block content %}
<h1>Kelas Grup</h1>
<div class="card row">
  <label>Tanggal: <input type="date" id="tgl"></label>
  <button id="lihat">Lihat</button>
</div>
<div id="daftar"></div>
<div class="card">
  <h3>Booking kelas</h3>
  <div class="row">
    <select id="b-kelas"></select>
    <select id="b-member"></select>
    <input type="date" id="b-tgl">
    <button id="b-btn">Booking</button>
  </div>
  <p id="b-msg"></p>
</div>
<h2>Booking pada tanggal terpilih</h2>
<table id="tbl"><thead><tr>
  <th>Kelas</th><th>Jam</th><th>Member</th><th>Status</th><th></th>
</tr></thead><tbody></tbody></table>
{% endblock %}
{% block script %}<script src="{{ url_for('static', filename='js/kelas.js') }}"></script>{% endblock %}
