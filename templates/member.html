{% extends "base.html" %}
{% block title %}Member — Membership Gym{% endblock %}
{% block content %}
<h1>Member</h1>
<div class="card">
  <h3>Tambah member</h3>
  <div class="row">
    <input id="nama" placeholder="Nama lengkap">
    <input id="nohp" placeholder="No. HP">
    <button id="tambah">Tambah</button>
  </div>
</div>
<table id="tbl"><thead><tr>
  <th>Nama</th><th>No. HP</th><th>Kode QR</th><th>Paket</th><th>Status</th><th></th>
</tr></thead><tbody></tbody></table>

<div id="modal" class="modal hidden"><div class="modal-box">
  <h3 id="m-nama"></h3>
  <img id="m-qr" alt="QR member" width="180" height="180">
  <p>Kode: <code id="m-kode"></code></p>
  <div id="m-info"></div>
  <div class="row" id="m-aksi"></div>
  <button id="tutup">Tutup</button>
</div></div>
{% endblock %}
{% block script %}<script src="{{ url_for('static', filename='js/member.js') }}"></script>{% endblock %}
